plugins {
    id 'com.android.application'
}

// Opcjonalny podpis release: jeśli istnieje keystore.properties w katalogu android/,
// build release zostanie podpisany. Plik ten NIE jest commitowany (zawiera hasła).
def keystorePropsFile = rootProject.file("keystore.properties")
def hasKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.hacklingo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.hacklingo.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        resValue "string", "app_name", "HackLingo"
    }

    if (hasKeystore) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

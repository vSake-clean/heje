<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#58cc02" />
  <meta name="description" content="HackLingo – bezpieczny, interaktywny kurs cyberbezpieczeństwa webowego w stylu Duolingo. Wszystkie laboratoria symulowane w przeglądarce." />
  <title>HackLingo – Kurs bezpieczeństwa webowego</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" aria-live="polite"></div>

  <!-- Dolny pasek nawigacji (mobilny + desktop) -->
  <nav id="tabbar" class="tabbar" aria-label="Nawigacja główna">
    <button class="tab" data-view="path" aria-label="Ścieżka nauki">
      <span class="tab-ico">🗺️</span><span class="tab-lbl">Nauka</span>
    </button>
    <button class="tab" data-view="practice" aria-label="Trening">
      <span class="tab-ico">🎯</span><span class="tab-lbl">Trening</span>
    </button>
    <button class="tab" data-view="glossary" aria-label="Słownik">
      <span class="tab-ico">📖</span><span class="tab-lbl">Słownik</span>
    </button>
    <button class="tab" data-view="profile" aria-label="Profil">
      <span class="tab-ico">👤</span><span class="tab-lbl">Profil</span>
    </button>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/labs.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

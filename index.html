<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Odkrywca – odkrywaj prawdziwy świat</title>
  <meta name="description" content="Mapa świata ukryta we mgle. Odsłaniaj miejsca, w których naprawdę byłeś.">
  <meta name="theme-color" content="#1d2340">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>

  <!-- Górny pasek -->
  <header class="topbar">
    <div class="brand glass">
      <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="4" opacity=".35"/>
        <path d="M32 10 L39 32 L32 54 L25 32 Z" fill="currentColor"/>
        <path d="M32 10 L39 32 L25 32 Z" fill="#ff7a59"/>
      </svg>
      <div>
        <div class="brand-name">Odkrywca</div>
        <div class="brand-sub" id="levelTitle">Turysta · poz. 1</div>
      </div>
    </div>

    <button class="chip glass" id="statChip" title="Statystyki">
      <span class="chip-ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="ring-bg"/><circle cx="18" cy="18" r="15" class="ring-fg" id="levelRing"/></svg><b id="levelNum">1</b></span>
      <span class="chip-text"><b id="chipArea">0 km²</b><small>odkryte</small></span>
    </button>
  </header>

  <!-- Wyszukiwarka -->
  <div class="search glass" id="searchBox">
    <svg viewBox="0 0 24 24" class="ico"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.25 4.24-1.42 1.42-4.24-4.25A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
    <input id="searchInput" type="search" placeholder="Szukaj miejsca na mapie…" autocomplete="off">
    <ul id="searchResults"></ul>
  </div>

  <!-- Prawe przyciski -->
  <div class="side-fabs">
    <button class="fab glass" id="btnLocate" title="Pokaż moją pozycję">
      <svg viewBox="0 0 24 24" class="ico"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm-1-6h2v3.06A7 7 0 0 1 18.94 11H22v2h-3.06A7 7 0 0 1 13 18.94V22h-2v-3.06A7 7 0 0 1 5.06 13H2v-2h3.06A7 7 0 0 1 11 5.06V2zm1 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
    </button>
    <button class="fab glass" id="btnSearch" title="Szukaj">
      <svg viewBox="0 0 24 24" class="ico"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.25 4.24-1.42 1.42-4.24-4.25A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
    </button>
    <button class="fab glass" id="btnLayers" title="Styl mapy">
      <svg viewBox="0 0 24 24" class="ico"><path d="M12 2l10 5.5-10 5.5L2 7.5 12 2zm-7.6 9.2L12 15.4l7.6-4.2 2.4 1.3-10 5.5-10-5.5 2.4-1.3zm0 5L12 20.4l7.6-4.2 2.4 1.3L12 23 2 17.5l2.4-1.3z"/></svg>
    </button>
    <button class="fab glass" id="btnFogToggle" title="Pokaż / ukryj mgłę">
      <svg viewBox="0 0 24 24" class="ico"><path d="M4 9h11a3 3 0 1 0-3-3h-2a5 5 0 1 1 5 5H4V9zm0 4h16a3 3 0 1 1-3 3h2a1 1 0 1 0 1-1H4v-2zm0 4h8v2H4v-2z"/></svg>
    </button>
  </div>

  <!-- Dolny pasek -->
  <nav class="dock glass">
    <button class="dock-btn" id="btnBrush" title="Pędzel – odsłoń miejsca, w których byłeś dawniej">
      <svg viewBox="0 0 24 24" class="ico"><path d="M20.7 3.3a1 1 0 0 1 0 1.4l-9 9-2.4-2.4 9-9a1 1 0 0 1 1.4 0l1 1zM8 13a3 3 0 0 1 3 3c0 2.2-1.8 4-4 4H3c1-1 1-2 1-3a4 4 0 0 1 4-4z"/></svg>
      <span>Pędzel</span>
    </button>
    <button class="dock-btn" id="btnPin" title="Dodaj wspomnienie">
      <svg viewBox="0 0 24 24" class="ico"><path d="M12 2a7 7 0 0 1 7 7c0 5.25-7 13-7 13S5 14.25 5 9a7 7 0 0 1 7-7zm0 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
      <span>Znacznik</span>
    </button>
    <button class="track-btn" id="btnTrack" title="Rozpocznij odkrywanie">
      <span class="track-pulse"></span>
      <svg viewBox="0 0 24 24" class="ico play"><path d="M8 5v14l11-7z"/></svg>
      <svg viewBox="0 0 24 24" class="ico stop"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
    <button class="dock-btn" id="btnJournal" title="Dziennik">
      <svg viewBox="0 0 24 24" class="ico"><path d="M5 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5V3zm2 2v14h10V5H7zm2 2h6v2H9V7zm0 4h6v2H9v-2z"/></svg>
      <span>Dziennik</span>
    </button>
    <button class="dock-btn" id="btnMenu" title="Ustawienia">
      <svg viewBox="0 0 24 24" class="ico"><path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM10.2 2h3.6l.5 2.6c.6.2 1.2.6 1.7 1l2.5-.9 1.8 3.1-2 1.7a7 7 0 0 1 0 2l2 1.7-1.8 3.1-2.5-.9c-.5.4-1.1.8-1.7 1l-.5 2.6h-3.6l-.5-2.6c-.6-.2-1.2-.6-1.7-1l-2.5.9-1.8-3.1 2-1.7a7 7 0 0 1 0-2l-2-1.7 1.8-3.1 2.5.9c.5-.4 1.1-.8 1.7-1l.5-2.6z"/></svg>
      <span>Ustawienia</span>
    </button>
  </nav>

  <!-- Status śledzenia -->
  <div class="tracking-status glass" id="trackStatus">
    <span class="dot"></span>
    <span id="trackStatusText">Odkrywanie aktywne</span>
    <span class="sep">·</span>
    <span id="trackSession">0 m</span>
  </div>

  <!-- Pasek trybu pędzla -->
  <div class="brush-bar glass" id="brushBar">
    <div class="seg">
      <button data-brush="reveal" class="active">🖌️ Odsłaniaj</button>
      <button data-brush="erase">🧽 Gumka</button>
    </div>
    <span class="brush-hint">Przeciągnij palcem po mapie</span>
    <button class="btn-small" id="brushDone">Gotowe</button>
  </div>

  <!-- Pasek podróży w czasie -->
  <div class="time-bar glass" id="timeBar">
    <div class="time-head">
      <span>⏳ Podróż w czasie</span>
      <b id="timeLabel">dziś</b>
      <button class="btn-icon" id="timePlay" title="Odtwórz">▶</button>
      <button class="btn-icon" id="timeClose" title="Zamknij">✕</button>
    </div>
    <input type="range" id="timeRange" min="0" max="0" value="0">
  </div>

  <!-- Panel boczny -->
  <aside class="panel" id="panel" aria-hidden="true">
    <div class="panel-grip"></div>
    <div class="panel-head">
      <div class="tabs" id="tabs">
        <button data-tab="stats" class="active">📊<span>Statystyki</span></button>
        <button data-tab="achievements">🏆<span>Odznaki</span></button>
        <button data-tab="places">🌍<span>Miejsca</span></button>
        <button data-tab="pins">📍<span>Wspomnienia</span></button>
        <button data-tab="settings">⚙️<span>Ustawienia</span></button>
      </div>
      <button class="btn-icon close" id="panelClose" title="Zamknij">✕</button>
    </div>
    <div class="panel-body">
      <section data-pane="stats" class="active" id="paneStats"></section>
      <section data-pane="achievements" id="paneAchievements"></section>
      <section data-pane="places" id="panePlaces"></section>
      <section data-pane="pins" id="panePins"></section>
      <section data-pane="settings" id="paneSettings"></section>
    </div>
  </aside>

  <!-- Wybór stylu mapy -->
  <div class="popover glass" id="layersPop">
    <h4>Mapa</h4>
    <div class="layer-grid" id="baseGrid"></div>
    <h4>Mgła</h4>
    <div class="swatches" id="fogGrid"></div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal" role="dialog" aria-modal="true">
      <div id="modalContent"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <input type="file" id="fileInput" accept=".json,.gpx,.geojson,.kml,application/json,application/gpx+xml" multiple hidden>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="js/geo.js"></script>
  <script src="js/store.js"></script>
  <script src="js/fog.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Zależności
        run: npm ci

      - name: Kopiowanie aplikacji webowej do projektu Android
        run: npx cap sync android

      - name: Budowanie APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Zmiana nazwy
        run: cp android/app/build/outputs/apk/release/app-release.apk Odkrywca.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Odkrywca-apk
          path: Odkrywca.apk

      - name: Wydanie (dla tagów v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Odkrywca.apk

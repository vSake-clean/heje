<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Odkrywca</title>
  <meta name="description" content="Mapa, która odsłania się tylko w miejscach, w których fizycznie byłeś.">
  <meta name="theme-color" content="#e4e2dc">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>

  <div class="summary card" id="summary">
    <span class="label">Odkryto</span>
    <b id="sumArea">0 m²</b>
    <span class="sub" id="sumToday">dziś 0 m</span>
  </div>

  <div class="tools card">
    <button id="btnLocate" title="Moja pozycja" aria-label="Moja pozycja">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
    </button>
    <button id="btnSearch" title="Szukaj miejsca" aria-label="Szukaj miejsca">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    </button>
    <button id="btnLayers" title="Rodzaj mapy" aria-label="Rodzaj mapy">
      <svg viewBox="0 0 24 24" class="ico"><path d="M12 3 2.5 8 12 13l9.5-5L12 3Z"/><path d="m2.5 12 9.5 5 9.5-5"/><path d="m2.5 16 9.5 5 9.5-5"/></svg>
    </button>
  </div>

  <div class="search card" id="searchBox">
    <input id="searchInput" type="search" placeholder="Szukaj miejsca" autocomplete="off" enterkeyhint="search">
    <ul id="searchResults"></ul>
  </div>

  <div class="layers card" id="layersPop" role="radiogroup" aria-label="Rodzaj mapy"></div>

  <div class="time card" id="timeBar">
    <div class="time-head">
      <span>Stan mapy na</span>
      <b id="timeLabel">dziś</b>
      <button class="link" id="timePlay">Odtwórz</button>
      <button class="link" id="timeClose">Zamknij</button>
    </div>
    <input type="range" id="timeRange" min="0" max="0" value="0" aria-label="Dzień">
  </div>

  <footer class="bar">
    <div class="status" id="status">
      <span class="dot"></span>
      <span id="statusText">Uruchamiam zapis</span>
    </div>
    <button class="btn" id="btnJournal">Dziennik</button>
  </footer>

  <aside class="panel" id="panel" aria-hidden="true">
    <div class="panel-head">
      <nav class="tabs" id="tabs">
        <button data-tab="stats" class="active">Statystyki</button>
        <button data-tab="achievements">Odznaki</button>
        <button data-tab="places">Miejsca</button>
        <button data-tab="settings">Ustawienia</button>
      </nav>
      <button class="close" id="panelClose" aria-label="Zamknij">
        <svg viewBox="0 0 24 24" class="ico"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <section data-pane="stats" class="active" id="paneStats"></section>
      <section data-pane="achievements" id="paneAchievements"></section>
      <section data-pane="places" id="panePlaces"></section>
      <section data-pane="settings" id="paneSettings"></section>
    </div>
  </aside>

  <!-- Ekran zgody na lokalizację: bez niej aplikacja nie ma sensu -->
  <div class="gate" id="gate" hidden>
    <div class="gate-inner">
      <img src="icons/icon.svg" alt="">
      <h1>Odkrywca</h1>
      <p>Mapa jest zakryta. Odsłania się tylko tam, gdzie fizycznie jesteś z telefonem.</p>
      <p>Zapis działa cały czas, także przy wyłączonym ekranie. Nie da się go wyłączyć ani ręcznie dopisać miejsc.</p>
      <p id="gateReason" class="muted"></p>
      <button class="btn primary" id="gateBtn">Zezwól na lokalizację</button>
    </div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal" role="dialog" aria-modal="true"><div id="modalContent"></div></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/store.js"></script>
  <script src="js/fog.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
